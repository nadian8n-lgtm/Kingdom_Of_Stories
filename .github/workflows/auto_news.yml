    for needle in ('class="main-nav"', 'class="footer"'):
        if needle not in text:
            problems.append(f"{page.relative_to(ROOT)} lacks {needle}")
    if page.parent.name == "articles":
        m = re.search(r'<img class="hero"[^>]*src="\.\./([^"]+)"', text)
