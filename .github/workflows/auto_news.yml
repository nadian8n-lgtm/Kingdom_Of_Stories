def share_bar():
    return ('<div class="share notranslate"><span>شارك المقال:</span>'
            '<button type="button" data-net="whatsapp" class="s-wa">واتساب</button>'
            '<button type="button" data-net="facebook" class="s-fb">فيسبوك</button>'
