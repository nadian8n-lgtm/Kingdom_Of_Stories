name: مملكة الأسرار — النشر التلقائي

on:
  schedule:
    - cron: '0 */2 * * *'   # كل ساعتين (الدورة الواحدة قد تستغرق أكثر من ساعة)
  workflow_dispatch:
    inputs:
      count:
        description: 'عدد المقالات في هذه الدورة لمملكة الأسرار (8 هو الافتراضي المتوازن)'
        default: '8'
      regen_images:
        description: 'صور مملكة الأسرار: fill = إصلاح 24 صورة بديلة في كل دورة (الافتراضي) / all = إعادة رسم كل الصور / none = لا شيء'
        type: choice
        default: fill
        options: [fill, all, none]

permissions:
  contents: write

concurrency:
  group: nexus-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # الحد الأقصى الآمن (سقف GitHub 360): الكود يتوقف بنفسه عند RUN_BUDGET_MIN ثم يبني ويرفع
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: فحص سريع لمفتاح مولّد النصوص (يفشل خلال ثوانٍ بدل 3 ساعات)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY}${GROQ_API_KEY}${OPENROUTER_API_KEY}" ]; then
            echo "::error::لا يوجد مفتاح مولّد نصوص. أضف GEMINI_API_KEY من https://aistudio.google.com/apikey في Settings > Secrets and variables > Actions > Secrets ثم أعد التشغيل. البدائل: GROQ_API_KEY أو OPENROUTER_API_KEY."
            exit 1
          fi
          echo "text secret present; the Python preflight will check that it actually works"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: pip install pillow edge-tts imageio-ffmpeg internetarchive
      - name: تثبيت حزمة Google Gen AI لتوليد القصص (خارج المستودع)
        run: |
          mkdir -p "$RUNNER_TEMP/genai"
          npm install --prefix "$RUNNER_TEMP/genai" --no-package-lock --no-audit --no-fund @google/genai
          echo "GENAI_DIR=$RUNNER_TEMP/genai" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/genai/node_modules" >> "$GITHUB_ENV"
      - name: كتابة قصص مملكة الأسرار وبناء الصفحات
        id: generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Cloudinary: إما CLOUDINARY_URL وحده، أو الأسرار الثلاثة CLOUD_NAME + API_KEY + API_SECRET
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          NP_API: ${{ vars.NP_API }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          # مولّدات صور مجانية (بلا بطاقة بنكية): Cloudflare Workers AI (Flux) ثم Together AI
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_IMAGE_MODEL: ${{ vars.CF_IMAGE_MODEL }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          TOGETHER_IMAGE_MODEL: ${{ vars.TOGETHER_IMAGE_MODEL }}
          # مساحة Hugging Face المجانية (FLUX) تعمل بلا أي مفتاح — احتياطي أخير قبل الصور البديلة
          HF_IMAGE_SPACE: ${{ vars.HF_IMAGE_SPACE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IMAGE_PROVIDERS: 'gemini,cloudflare,together,hfspace,genai,openai'
          GENAI_IMAGE_MODEL: ${{ vars.GENAI_IMAGE_MODEL }}
          # مصنع القصص والأفلام: video_factory.py يُستدعى داخل fetch_news.py (بلا خطوة منفصلة).
          # ملف MP4 يُرفع إلى Internet Archive ولا يُخزَّن داخل المستودع؛ صور المشاهد images/story-<id>-scene-<n>.webp تبقى هنا.
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          IA_COLLECTION: ${{ vars.IA_COLLECTION }}
          IA_IDENTIFIER_PREFIX: ${{ vars.IA_IDENTIFIER_PREFIX }}
          EDGE_TTS_VOICE: ${{ vars.EDGE_TTS_VOICE }}
          VIDEO_PER_RUN: ${{ vars.VIDEO_PER_RUN || '1' }}
          VIDEO_MAX_MINUTES: ${{ vars.VIDEO_MAX_MINUTES || '20' }}
          VIDEO_MAX_SCENES: ${{ vars.VIDEO_MAX_SCENES || '40' }}
          VIDEO_FPS: ${{ vars.VIDEO_FPS || '24' }}
          MAX_PER_RUN: ${{ github.event.inputs.count || '8' }}
          MIN_PER_CATEGORY: ${{ vars.MIN_PER_CATEGORY || '15' }}
          KEEP_PER_CATEGORY: ${{ vars.KEEP_PER_CATEGORY || '30' }}
          # fill يُترجم داخل الكود إلى svg: إصلاح محدود للصور البديلة في كل دورة
          # إصلاح الصور البديلة تلقائياً في كل دورة: 24 صورة (الأحدث أولاً) حتى لا تبقى أي صورة مرسومة
          REGEN_IMAGES: ${{ github.event.inputs.regen_images || 'fill' }}
          HEAL_IMAGES: ${{ vars.HEAL_IMAGES || '24' }}
          # إعادة صياغة 10 مقالات قديمة بأسلوب مملكة الأسرار (عناوين جديدة + تصحيح لغوي)
          RESTYLE_ARCHIVE: ${{ vars.RESTYLE_ARCHIVE || '10' }}
          # بعد هذه المدة يتوقف التوليد ويُبنى الموقع ويُرفع ما جُهّز — فلا تُلغى دورة كاملة أبداً
          RUN_BUDGET_MIN: ${{ vars.RUN_BUDGET_MIN || '150' }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
          NEWSLETTER_BUTTONDOWN: ${{ vars.NEWSLETTER_BUTTONDOWN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python fetch_news.py
      - name: فحص صفحات القصص (الروابط والصور والملفات الأساسية)
        id: check
        if: ${{ !cancelled() }}
        run: python check_site.py
      - name: تدقيق جودة القصص (التكرار والصور الضبابية والتصنيفات الخاطئة)
        id: audit
        if: ${{ !cancelled() }}
        env:
          ADSENSE_MIN_PER_CATEGORY: ${{ vars.ADSENSE_MIN_PER_CATEGORY || '0' }}
        run: python adsense_audit.py
      - name: حفظ القصص والصفحات ورفعها (بدون تعارضات)
        if: ${{ !cancelled() && steps.check.outcome == 'success' && steps.audit.outcome == 'success' }}
        run: |
          git config user.name "KingdomSecrets-Bot"
          git config user.email "bot@users.noreply.github.com"
          # node_modules must never be committed (it was added by mistake before)
          grep -qx 'node_modules/' .gitignore 2>/dev/null || echo 'node_modules/' >> .gitignore
          git rm -r -q --cached node_modules 2>/dev/null || true
          # git add -A يضيف صور المشاهد الجديدة images/story-*-scene-*.webp؛ ملفات MP4 لا تُخزَّن هنا بل تُرفع إلى Internet Archive
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "نشر تلقائي: قصص وأفلام جديدة"
          for i in 1 2 3 4; do
            git fetch origin main
            if ! git merge --no-edit -X ours origin/main; then
              # generated files (html/json/images) always win; then finish the merge
              git checkout --ours . 2>/dev/null || true
              git add -A
              git commit --no-edit -m "دمج تلقائي" || git merge --abort || true
            fi
            python3 - <<'PY'
          import json, subprocess
          try:
              mine = json.load(open("news-state.json"))["used"]
              theirs = json.loads(subprocess.check_output(["git", "show", "origin/main:news-state.json"]))["used"]
              merged = sorted(set(mine) | set(theirs))[-3000:]
              if merged != mine:
                  json.dump({"used": merged}, open("news-state.json", "w"))
          except Exception as e:
              print("state merge skipped:", e)
          PY
            git add -A
            git diff --cached --quiet || git commit -qm "دمج سجل المقالات المستخدمة"
            if git push origin HEAD:main; then echo "pushed"; exit 0; fi
            echo "push failed, retry $i"; sleep $((i * 6))
          done
          echo "::error::could not push after 4 attempts"; exit 1
