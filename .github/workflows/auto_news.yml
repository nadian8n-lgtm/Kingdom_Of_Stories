    flat = sorted(((k, a) for k, v in arts.items() for a in v), key=lambda t: t[1]["date"], reverse=True)
    kept, removed = [], []
    for k, a in flat:
        if any(duplicates(a, b) for _, b in kept):
            removed.append(a)
        else:
            kept.append((k, a))
    keep_ids = {a["id"] for _, a in kept}
    for k in arts:
        arts[k] = [a for a in arts[k] if a["id"] in keep_ids]
