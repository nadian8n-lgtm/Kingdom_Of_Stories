name: مملكة الأسرار — إعادة بناء القصص

# يُشغّله صاحب مملكة الأسرار من لوحة التحكم بعد أي تحرير يدوي للقصص (أو يدوياً من تبويب Actions).
# الوظيفة: بناء صفحات القصص من articles.json ورفعها فوراً، بدل انتظار دورة النشر التلقائي (كل ساعتين).
# لا يكتب قصصاً جديدة ولا يلمس الصور: البناء وحده (build_site.ensure_images يرسم أي صورة ناقصة).

on:
  workflow_dispatch:

permissions:
  contents: write

# نفس مجموعة النشر التلقائي: لا يعمل الاثنان في اللحظة نفسها، فلا يحدث تعارض على articles.json
concurrency:
  group: nexus-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pillow

      - name: بناء صفحات قصص مملكة الأسرار من articles.json
        env:
          # نفس متغيرات بناء صفحات القصص المستعملة في النشر التلقائي حتى تبقى الصفحات متطابقة
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
          NEWSLETTER_BUTTONDOWN: ${{ vars.NEWSLETTER_BUTTONDOWN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          NP_API: ${{ vars.NP_API }}
        run: |
          python build_site.py
          python - <<'PY'
          import json
          d = json.load(open("articles.json", encoding="utf-8"))
          manual = sum(1 for v in d["articles"].values() for a in v if a.get("manual"))
          print("total articles:", sum(len(v) for v in d["articles"].values()), "| manual:", manual)
          print({k: len(v) for k, v in d["articles"].items()})
          PY

      - name: فحص صفحات القصص (الروابط والصور والملفات الأساسية)
        run: python check_site.py

      - name: تدقيق جودة القصص (التكرار والصور والتصنيفات الخاطئة)
        env:
          ADSENSE_MIN_PER_CATEGORY: ${{ vars.ADSENSE_MIN_PER_CATEGORY || '0' }}
        run: python adsense_audit.py

      - name: حفظ صفحات القصص ورفعها
        run: |
          git config user.name "KingdomSecrets-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to rebuild"; exit 0; fi
          git commit -m "إعادة بناء مملكة الأسرار بعد تحرير يدوي"
          for i in 1 2 3 4; do
            git fetch origin main
            if git push origin HEAD:main; then echo "pushed"; exit 0; fi
            echo "push rejected, syncing and retrying $i"
            git pull --rebase --autostash origin main || { git rebase --abort || true; }
            sleep $((i * 5))
          done
          echo "::error::could not push after 4 attempts"; exit 1
